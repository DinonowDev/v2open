# Enforce tier PR directions (task→dev, fix→stage, prod←stage only, …).
name: Branch flow guard

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate head/base
        run: |
          HEAD="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          chmod +x ./scripts/branch-flow-validate.sh
          ./scripts/branch-flow-validate.sh "$HEAD" "$BASE"
