name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Test
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Tag matches VERSION
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(sed -n '1p' VERSION | tr -d '[:space:]')"
          if [[ "$TAG" != "$VER" ]]; then
            echo "Git tag v$TAG does not match VERSION ($VER). Bump VERSION before tagging." >&2
            exit 1
          fi
          ./scripts/check-version.sh

      - name: Rust tests
        working-directory: native
        run: cargo test -p v2core -- --skip ping_sets_positive_ms_for_real_host

      - name: Swift tests
        run: ./scripts/test-swift.sh

  build:
    name: macOS ${{ matrix.arch }}
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Go for dnstt
        if: matrix.arch == 'x86_64'
        uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROFILE_APP_BASE64: ${{ secrets.APPLE_PROFILE_APP_BASE64 }}
          APPLE_PROFILE_TUNNEL_BASE64: ${{ secrets.APPLE_PROFILE_TUNNEL_BASE64 }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/ci-import-certificate.sh

      - name: Build app bundle
        env:
          V2OPEN_ARCH: ${{ matrix.arch }}
        run: ./build-macos.sh

      - name: Verify bundle signature
        id: signing
        run: |
          chmod +x ./scripts/verify-macos-bundle.sh
          ./scripts/verify-macos-bundle.sh V2Open.app | tee "signing-report-${{ matrix.arch }}.txt"

      - name: Upload signing report
        uses: actions/upload-artifact@v4
        with:
          name: signing-report-${{ matrix.arch }}
          path: signing-report-${{ matrix.arch }}.txt
          retention-days: 1
          if-no-files-found: error

      - name: Package zip
        run: |
          VERSION="$(sed -n '1p' VERSION | tr -d '[:space:]')"
          BUILD="$(sed -n '2p' VERSION | tr -d '[:space:]')"
          ZIP="V2Open-${VERSION}-build${BUILD}-macos-${{ matrix.arch }}.zip"
          ditto -c -k --keepParent V2Open.app "$ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: ${{ env.ZIP }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: GitHub Release
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@v4
        with:
          pattern: signing-report-*
          path: signing-reports
          merge-multiple: true

      - name: Release notes from CHANGELOG
        run: |
          ./scripts/changelog-section.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "### Code signature"
            echo ""
            if compgen -G "signing-reports/*.txt" > /dev/null; then
              for report in signing-reports/*.txt; do
                echo "**$(basename "$report" .txt)**"
                echo '```'
                cat "$report"
                echo '```'
              done
              if grep -q "V2OPEN_SIGNING=notarized" signing-reports/*.txt 2>/dev/null; then
                echo "These builds are **notarized** and should open without \`xattr -cr\`."
              else
                echo "These builds are **not notarized**. Use **Right-click → Open** the first time, or set Apple signing secrets (see docs/apple-ci-secrets.md)."
              fi
            else
              echo "Signing report unavailable for this release."
            fi
            echo ""
            echo "### Download checksums (SHA-256)"
            echo ""
            for zip in dist/*.zip; do
              [[ -f "$zip" ]] || continue
              sum="$(shasum -a 256 "$zip" | awk '{print $1}')"
              base="$(basename "$zip")"
              echo "- \`$base\`: \`$sum\`"
            done
          } >> release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body_path: release-notes.md
          draft: false
          prerelease: false
