[package]
name = "v2core"
version = "1.1.0"
edition = "2021"

[lib]
name = "v2core"
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "2"
libc = "0.2"
socket2 = "0.5"
aes = "0.8"
aes-gcm = "0.10"
cfb-mode = "0.8"
cipher = "0.4"
chacha20 = "0.9"
ctr = "0.9"
getrandom = "0.2"
hmac = "0.12"
md-5 = "0.10"
pbkdf2 = "0.12"
sha1 = "0.10"
sha2 = "0.10"
